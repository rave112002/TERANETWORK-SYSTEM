# Weekly Security Audit Workflow
# Runs npm audit weekly against both packages to check for vulnerabilities

name: Weekly Security Audit

on:
  schedule:
    # Run every Monday at 9:00 AM UTC
    - cron: "0 9 * * 1"
  workflow_dispatch: # Allow manual trigger

jobs:
  security-audit:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        package: [front, back]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: ${{ matrix.package }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.package }}
        run: npm ci

      - name: Run npm audit
        working-directory: ${{ matrix.package }}
        run: |
          npm audit --audit-level=moderate || echo "Vulnerabilities found"
          npm audit --json > audit-results.json

      - name: Check for vulnerabilities
        working-directory: ${{ matrix.package }}
        run: |
          VULNERABILITIES=$(cat audit-results.json | jq '.metadata.vulnerabilities | .moderate + .high + .critical')
          echo "Found $VULNERABILITIES vulnerabilities"

          if [ "$VULNERABILITIES" -gt 0 ]; then
            echo "⚠️ Security vulnerabilities detected!"
            echo "Run 'npm audit fix' to resolve issues"
            exit 1
          fi

      - name: Upload audit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-results-${{ matrix.package }}
          path: ${{ matrix.package }}/audit-results.json
          retention-days: 30

      - name: Create issue if vulnerabilities found
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '⚠️ Security Vulnerabilities Detected (${{ matrix.package }})',
              body: `## Security Audit Failed

              The weekly security audit has detected vulnerabilities in npm packages in \`${{ matrix.package }}/\`.

              ### Action Required
              1. Review the audit results in the workflow artifacts
              2. Run \`npm audit\` locally to see details
              3. Run \`npm audit fix\` to auto-fix issues
              4. For manual fixes, update packages individually

              ### Commands
              \`\`\`bash
              cd ${{ matrix.package }}
              npm audit
              npm audit fix
              \`\`\`
              `,
              labels: ['security', 'dependencies', 'high-priority']
            })
