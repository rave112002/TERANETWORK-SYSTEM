<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="description"
      content="Multi-tenant admin platform — SuperAdmin and Admin portals with role-based access control."
    />
    <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)" />
    <title>TERANETWORK</title>
    <!-- Fonts are self-hosted via @fontsource-variable (imported in main.jsx).
         No Google Fonts <link> here: it double-loaded the same families and made
         every production page hit an external origin. -->
    <!-- Apply the saved/system theme before paint to avoid a flash of the wrong mode -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("ui-theme");
          var mode = stored ? JSON.parse(stored).state.mode : null;
          if (!mode) {
            mode = window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
          }
          if (mode === "dark") document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
